
name: Terraform S3 Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-s3-lab
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_bucket_name: ${{ vars.TF_BUCKET_NAME }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          BUCKET_NAME: ${{ vars.TF_BUCKET_NAME }}
        run: |
          missing=0
          for v in AWS_ROLE_ARN BUCKET_NAME; do
            if [ -z "${!v}" ]; then
              name=$v; [ "$v" = BUCKET_NAME ] && name=TF_BUCKET_NAME
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables)."
              missing=1
            fi
          done
          exit $missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          allowed-account-ids: "141553305125"

      - name: Validate AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
